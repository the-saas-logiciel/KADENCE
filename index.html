µ<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <title>KADENCE — Application</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #09090b;
      --surface: #111114;
      --surface-2: #18181c;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.22);
      --text: #f4f4f6;
      --muted: #9a9aa4;
      --accent: #ffffff;
      --accent-ink: #09090b;
      --ok: #34d399;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .app-shell {
      max-width: 1140px;
      margin: 0 auto;
      padding: 18px 20px 48px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 16px;
    }

    .brand-group { display: flex; align-items: center; gap: 12px; }
    .brand-dot { width: 9px; height: 9px; border-radius: 999px; background: var(--accent); }
    .app-title { font-weight: 700; letter-spacing: 0.08em; font-size: 0.95rem; }
    .app-sub { font-size: 0.78rem; color: var(--muted); }

    .top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 0.82rem;
    }
    .pill strong { font-variant-numeric: tabular-nums; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.1s ease, opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn:active { transform: scale(0.985); }
    .btn-primary { background: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover { opacity: 0.92; }
    .btn-ghost { background: var(--surface-2); color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { border-color: var(--border-strong); }
    .btn-sm { padding: 6px 10px; font-size: 0.78rem; border-radius: 7px; }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      padding: 9px 14px;
      border-radius: 9px;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    .panel-view { display: none; }
    .panel-view.active { display: block; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    @media (max-width: 920px) {
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-label {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }

    .kpi-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
    }
    .kpi-top { display: flex; justify-content: space-between; gap: 8px; font-size: 0.86rem; margin-bottom: 7px; }
    .kpi-nums { color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
    .bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 9px; }
    .bar-fill { height: 100%; background: var(--accent); transition: width 0.2s ease; }
    .kpi-actions { display: flex; flex-wrap: wrap; gap: 6px; }

    .routine-list { display: flex; flex-direction: column; gap: 7px; }
    .routine-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; font-size: 0.85rem;
    }
    .routine-check { display: flex; align-items: center; gap: 9px; cursor: pointer; flex: 1; }
    .routine-item input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
    .routine-item.done span { text-decoration: line-through; color: var(--muted); }

    input.field, textarea.area, select.field {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 11px;
      font-family: inherit;
      font-size: 0.84rem;
    }
    input.field:focus, textarea.area:focus, select.field:focus { outline: none; border-color: var(--border-strong); }
    textarea.area { min-height: 120px; resize: vertical; }

    .row-add { display: grid; grid-template-columns: 1fr 68px auto; gap: 7px; }
